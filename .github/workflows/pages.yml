# Despliegue opcional del FRONTEND a GitHub Pages.
# Sin backend la interfaz carga, pero el asistente no responde: no hay IA simulada. Para usarlo definí la
# variable de repositorio VITE_API_URL con la URL del backend (Settings → Secrets and variables → Actions → Variables) y sumá el dominio de
# Pages (https://<usuario>.github.io) a CORS_ORIGINS en Vercel.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
          # Pages no sabe de rutas del router: un 404 sirve la app para que /leer/d1 funcione al recargar.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
