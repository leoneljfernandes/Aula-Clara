<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aula Clara · Plataforma de Accesibilidad Educativa (MVP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; }
  body { font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; font-size: 18px; }
  *:focus { outline: none; }
  *:focus-visible { outline: 4px solid var(--focus, #C2410C); outline-offset: 3px; border-radius: 10px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .skip-link { position:absolute; left:12px; top:-80px; z-index:100; }
  .skip-link:focus { top:12px; }
  input[type=range] { accent-color: var(--accent); height: 32px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
  .dot { animation: blink 1.2s infinite; }
  .dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
  .reading-block { transition: background-color .25s ease; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  #boot { font-family: Verdana, sans-serif; padding: 40px; font-size: 20px; }
</style>
</head>
<body>
<div id="root"><p id="boot">Cargando Aula Clara…</p></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useContext, createContext, useCallback, useMemo } = React;

/* ───────────────────────── Configuración ───────────────────────── */

const THEMES = {
  claro:     { label: 'Claro',          swatch: ['#FFFFFF', '#0A0A0A'], vars: { bg:'#FFFFFF', fg:'#0A0A0A', panel:'#F3F4F6', muted:'#374151', border:'#6B7280', accent:'#1D4ED8', onAccent:'#FFFFFF', soft:'#E0E7FF', hl:'#FDE047', hlFg:'#0A0A0A', focus:'#C2410C' } },
  sepia:     { label: 'Sepia',          swatch: ['#F4ECD8', '#2B2113'], vars: { bg:'#F4ECD8', fg:'#2B2113', panel:'#EADFC2', muted:'#4A3B26', border:'#8A7556', accent:'#7C2D12', onAccent:'#FFFFFF', soft:'#E4D3AA', hl:'#E9B949', hlFg:'#1A1208', focus:'#1D4ED8' } },
  oscuro:    { label: 'Oscuro cálido',  swatch: ['#1C1917', '#F2E8D8'], vars: { bg:'#1C1917', fg:'#F2E8D8', panel:'#292524', muted:'#D6C8B2', border:'#A8A29E', accent:'#FDBA74', onAccent:'#1C1917', soft:'#3A332E', hl:'#92400E', hlFg:'#FFF7ED', focus:'#FDE047' } },
  contraste: { label: 'Alto contraste', swatch: ['#000000', '#FFE600'], vars: { bg:'#000000', fg:'#FFE600', panel:'#0A0A0A', muted:'#FFFFFF', border:'#FFE600', accent:'#00E5FF', onAccent:'#000000', soft:'#262600', hl:'#FFFFFF', hlFg:'#000000', focus:'#FF4FD8' } },
};
const THEME_ORDER = ['claro', 'sepia', 'oscuro', 'contraste'];

const FONTS = {
  arial:    { label: 'Arial',                    css: 'Arial, Helvetica, sans-serif' },
  verdana:  { label: 'Verdana',                  css: 'Verdana, Geneva, sans-serif' },
  atkinson: { label: 'Atkinson Hyperlegible',    css: "'Atkinson Hyperlegible', Verdana, sans-serif" },
  dyslexic: { label: 'OpenDyslexic (simulada)',  css: "'Lexend', Verdana, sans-serif", extra: { letterSpacing: '0.05em', wordSpacing: '0.16em' } },
};

const PROFILES = [
  { id: 'dislexia', title: 'Dislexia', icon: 'Aa',
    desc: 'Fuente especializada, mayor interlineado y más espacio entre letras.',
    tags: ['OpenDyslexic', 'Interlineado amplio', 'Fondo sepia'],
    preset: { font: 'dyslexic', fontSize: 21, lineHeight: 1.9, theme: 'sepia', audioFocus: false } },
  { id: 'vision', title: 'Visión reducida', icon: 'A+',
    desc: 'Alto contraste y texto grande para leer sin esfuerzo.',
    tags: ['Texto 28 px', 'Negro y amarillo', 'Tipografía legible'],
    preset: { font: 'atkinson', fontSize: 28, lineHeight: 1.7, theme: 'contraste', audioFocus: false } },
  { id: 'fatiga', title: 'Fatiga visual', icon: '☾',
    desc: 'Modo oscuro cálido y la lectura en voz alta siempre a mano.',
    tags: ['Modo oscuro cálido', 'Audio destacado', 'Verdana'],
    preset: { font: 'verdana', fontSize: 20, lineHeight: 1.8, theme: 'oscuro', audioFocus: true } },
  { id: 'custom', title: 'Personalizado', icon: '⚙',
    desc: 'Elegí vos el tamaño, los colores y la tipografía.',
    tags: ['Control total'], preset: null },
];

const DEFAULT_SETTINGS = { theme: 'claro', font: 'atkinson', fontSize: 20, lineHeight: 1.7, rate: 1, audioFocus: false };
const MIN_FS = 14, MAX_FS = 40;

const INITIAL_DOCS = [
  { id: 'd1', title: 'Accesibilidad digital en la educación superior', subject: 'Tecnología Educativa', type: 'PDF', date: '11 nov 2026', progress: 0.42 },
  { id: 'd2', title: 'Introducción a la Epidemiología – Unidad 2', subject: 'Salud Pública', type: 'Word', date: '8 nov 2026', progress: 0.85 },
  { id: 'd3', title: 'Metodología de la investigación: diseño de encuestas', subject: 'Metodología', type: 'PowerPoint', date: '2 nov 2026', progress: 0.10 },
];

/* Contenido simulado del documento procesado */
const ARTICLE = {
  title: 'Accesibilidad digital en la educación superior: barreras y oportunidades',
  meta: 'Unidad 3 · Cátedra de Tecnología Educativa · Material de lectura obligatoria',
  blocks: [
    { type: 'h2', text: '1. Introducción' },
    { type: 'p', text: 'La incorporación de entornos virtuales de aprendizaje en la universidad amplió el acceso a los materiales de estudio, pero también reprodujo barreras que afectan de manera desigual a estudiantes con discapacidad visual, dislexia u otras dificultades en el procesamiento de la información. Un documento digital no es accesible por el solo hecho de estar en formato electrónico.' },
    { type: 'p', text: 'Diversos relevamientos señalan que la mayor parte del material académico circula como PDF escaneado o como presentaciones sin estructura semántica. Esto impide que los lectores de pantalla identifiquen títulos, listas o tablas, y obliga al estudiante a depender de terceros para acceder al contenido.' },
    { type: 'h2', text: '2. Marco normativo' },
    { type: 'p', text: 'Las Pautas de Accesibilidad para el Contenido Web (WCAG 2.2) establecen cuatro principios: el contenido debe ser perceptible, operable, comprensible y robusto. En el ámbito nacional, la Ley 26.653 de Accesibilidad de la Información en las Páginas Web obliga a los organismos públicos, incluidas las universidades nacionales, a respetar estas pautas.' },
    { type: 'p', text: 'Sin embargo, el cumplimiento normativo suele concentrarse en los sitios institucionales y no alcanza al material de cátedra, que es producido de forma descentralizada por cada docente, con herramientas y criterios heterogéneos.' },
    { type: 'h2', text: '3. Evolución de la matrícula' },
    { type: 'p', text: 'Como se observa en el Gráfico 1, la cantidad de estudiantes que declaran alguna discapacidad creció de manera sostenida entre 2019 y 2024. El incremento más pronunciado se registra a partir de 2021, en coincidencia con la expansión de la modalidad virtual y de los programas de ingreso con acompañamiento.' },
    { type: 'figure' },
    { type: 'p', text: 'Este crecimiento no fue acompañado por un aumento proporcional de los recursos de adaptación: la relación entre estudiantes que requieren apoyo y personal técnico especializado se duplicó en el mismo período, con demoras de hasta tres semanas en la entrega de materiales adaptados.' },
    { type: 'h2', text: '4. Diseño Universal para el Aprendizaje' },
    { type: 'p', text: 'El Diseño Universal para el Aprendizaje (DUA) propone anticipar la diversidad desde el origen, ofreciendo múltiples formas de representación, de acción y expresión, y de implicación. En lugar de adaptar el material caso por caso, se busca que cada recurso sea flexible desde su concepción.' },
    { type: 'p', text: 'Las herramientas basadas en inteligencia artificial abren una oportunidad concreta para este enfoque: permiten describir imágenes, reformular textos complejos y convertir contenido a audio de manera inmediata, devolviendo al estudiante la autonomía sobre su propio proceso de estudio.' },
    { type: 'h2', text: '5. Conclusiones' },
    { type: 'p', text: 'La accesibilidad no debe entenderse como una adaptación excepcional, sino como una condición de calidad del material educativo. Las instituciones que integren herramientas de adaptación automática podrán reducir la dependencia de terceros y la fragmentación de recursos que hoy caracteriza la experiencia de los estudiantes con discapacidad.' },
  ],
};
const CHART = [ ['2019', 1240], ['2020', 1410], ['2021', 1980], ['2022', 2460], ['2023', 2910], ['2024', 3350] ];
const IMAGE_ANALYSIS = 'Análisis de IA: Este gráfico de barras muestra la evolución de la matrícula de estudiantes con discapacidad entre 2019 y 2024. Hay seis barras verticales, una por año, que crecen de izquierda a derecha: de unos 1.240 estudiantes en 2019 a unos 3.350 en 2024, es decir, casi el triple. El salto más grande ocurre entre 2020 y 2021, con unos 570 estudiantes más. Idea principal: la matrícula crece de forma sostenida y se acelera a partir de 2021.';

/* ───────────────────────── Utilidades ───────────────────────── */

const storage = {
  get(k) { try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const prefersReducedMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const hasTTS = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; } catch (e) { return false; } })();

function speakOnce(text, rate = 1) {
  if (!hasTTS) return false;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-AR'; u.rate = rate;
    const v = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

/* ───────────────────────── Estado global (Context API) ───────────────────────── */

const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

function AppProvider({ children }) {
  const saved = useMemo(() => storage.get('aulaclara.settings'), []);
  const savedProfile = useMemo(() => storage.get('aulaclara.profile'), []);
  const [settings, setSettings] = useState(saved || DEFAULT_SETTINGS);
  const [profile, setProfile] = useState(savedProfile);
  const [view, setView] = useState(savedProfile ? 'dashboard' : 'onboarding');
  const [docs, setDocs] = useState(INITIAL_DOCS);
  const [currentDocId, setCurrentDocId] = useState(null);
  const [liveMsg, setLiveMsg] = useState('');

  const updateSettings = useCallback(patch => setSettings(s => ({ ...s, ...patch })), []);
  const announce = useCallback(msg => { setLiveMsg(''); setTimeout(() => setLiveMsg(msg), 40); }, []);

  useEffect(() => { if (profile) storage.set('aulaclara.settings', settings); }, [settings, profile]);

  const saveProfile = useCallback((id) => {
    setProfile(id); storage.set('aulaclara.profile', id); storage.set('aulaclara.settings', settings);
  }, [settings]);

  const openDoc = useCallback(id => { setCurrentDocId(id); setView('reader'); window.scrollTo(0, 0); }, []);
  const addDoc = useCallback(file => {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const type = ext === 'pdf' ? 'PDF' : ext.startsWith('ppt') ? 'PowerPoint' : 'Word';
    const doc = { id: 'u' + Date.now(), title: file.name.replace(/\.[^.]+$/, ''), subject: 'Subido recién', type,
      date: new Date().toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' }), progress: 0 };
    setDocs(ds => [doc, ...ds]);
    return doc.id;
  }, []);
  const setProgress = useCallback((id, p) => setDocs(ds => ds.map(d => d.id === id && p > d.progress ? { ...d, progress: p } : d)), []);

  const theme = THEMES[settings.theme] || THEMES.claro;
  const cssVars = {};
  Object.entries(theme.vars).forEach(([k, v]) => { cssVars['--' + k] = v; });

  useEffect(() => { document.body.style.background = theme.vars.bg; }, [theme]);

  const value = { view, setView, settings, updateSettings, profile, saveProfile, docs, addDoc, openDoc,
    currentDoc: docs.find(d => d.id === currentDocId), setProgress, announce };

  return (
    <AppCtx.Provider value={value}>
      <div style={cssVars} className="min-h-screen bg-[var(--bg)] text-[var(--fg)]">
        <div className="sr-only" role="status" aria-live="polite">{liveMsg}</div>
        {children}
      </div>
    </AppCtx.Provider>
  );
}

/* ───────────────────────── Componentes base ───────────────────────── */

function Btn({ variant = 'secondary', className = '', type = 'button', ...p }) {
  const base = 'inline-flex items-center justify-center gap-2 min-h-[48px] px-4 rounded-xl font-bold border-2 text-[17px] leading-tight transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
  const v = {
    primary:   'bg-[var(--accent)] text-[var(--onAccent)] border-[var(--accent)] hover:brightness-110',
    secondary: 'bg-[var(--bg)] text-[var(--fg)] border-[var(--border)] hover:bg-[var(--soft)]',
    ghost:     'bg-transparent text-[var(--fg)] border-transparent hover:bg-[var(--soft)]',
  };
  return <button type={type} className={`${base} ${v[variant]} ${className}`} {...p} />;
}

function Logo() {
  return (
    <div className="flex items-center gap-3">
      <span aria-hidden="true" className="grid place-items-center w-11 h-11 rounded-xl bg-[var(--accent)] text-[var(--onAccent)] text-xl font-bold">A</span>
      <span className="text-xl font-bold tracking-tight">Aula Clara</span>
    </div>
  );
}

function ProgressBar({ value, label }) {
  const pct = Math.round(value * 100);
  return (
    <div className="flex items-center gap-3">
      <div className="flex-1 h-3 rounded-full border-2 border-[var(--border)] overflow-hidden" role="progressbar" aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100" aria-label={label}>
        <div className="h-full bg-[var(--accent)]" style={{ width: pct + '%' }} />
      </div>
      <span className="text-base font-bold w-12 text-right">{pct}%</span>
    </div>
  );
}

function ThemeButtons({ compact = false }) {
  const { settings, updateSettings, announce } = useApp();
  return (
    <div className={`grid ${compact ? 'grid-cols-2' : 'grid-cols-2 sm:grid-cols-4'} gap-2`} role="group" aria-label="Tema de color">
      {THEME_ORDER.map(k => {
        const t = THEMES[k]; const active = settings.theme === k;
        return (
          <button key={k} type="button" aria-pressed={active}
            onClick={() => { updateSettings({ theme: k }); announce('Tema ' + t.label); }}
            className={`flex items-center gap-2 min-h-[52px] ${compact ? 'px-2 text-[15px]' : 'px-3 text-[16px]'} rounded-xl border-2 font-bold text-left ${active ? 'border-[var(--accent)] bg-[var(--soft)]' : 'border-[var(--border)] hover:bg-[var(--soft)]'}`}
            style={active ? { boxShadow: 'inset 0 0 0 2px var(--accent)' } : null}>
            <span aria-hidden="true" className="grid place-items-center w-8 h-8 rounded-lg border-2 shrink-0 font-bold text-sm"
              style={{ background: t.swatch[0], color: t.swatch[1], borderColor: t.swatch[1] }}>Aa</span>
            <span className="min-w-0 leading-tight">{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function readingStyle(settings) {
  const f = FONTS[settings.font] || FONTS.arial;
  return { fontFamily: f.css, fontSize: settings.fontSize + 'px', lineHeight: settings.lineHeight, ...(f.extra || {}) };
}

/* ───────────────────────── Pantalla 1: Onboarding ───────────────────────── */

function Onboarding() {
  const { settings, updateSettings, saveProfile, setView, profile, announce } = useApp();
  const [step, setStep] = useState(1);
  const [sel, setSel] = useState(profile);
  const headingRef = useRef(null);

  useEffect(() => { headingRef.current && headingRef.current.focus(); }, [step]);

  const choose = (p) => { setSel(p.id); if (p.preset) { updateSettings(p.preset); announce('Perfil ' + p.title + ' aplicado'); } };
  const finish = () => { saveProfile(sel); announce('Preferencias guardadas'); setView('dashboard'); };

  return (
    <div className="min-h-screen flex flex-col">
      <header className="px-6 py-4 border-b-2 border-[var(--border)] flex items-center justify-between">
        <Logo />
        <span className="text-[var(--muted)] font-bold">Paso {step} de 2</span>
      </header>
      <main id="contenido" className="flex-1 w-full max-w-4xl mx-auto px-5 py-10">
        <ol className="flex gap-3 mb-8" aria-label="Progreso de la configuración">
          {['Elegí tu perfil', 'Ajustá los detalles'].map((s, i) => (
            <li key={s} className="flex-1" aria-current={step === i + 1 ? 'step' : undefined}>
              <div className={`h-2 rounded-full ${step >= i + 1 ? 'bg-[var(--accent)]' : 'bg-[var(--soft)] border border-[var(--border)]'}`} />
              <span className={`block mt-2 text-base ${step === i + 1 ? 'font-bold' : 'text-[var(--muted)]'}`}>{i + 1}. {s}</span>
            </li>
          ))}
        </ol>

        {step === 1 && (
          <section aria-labelledby="ob-title">
            <h1 id="ob-title" ref={headingRef} tabIndex="-1" className="text-4xl font-bold mb-3">Personalizá tu experiencia de lectura</h1>
            <p className="text-xl text-[var(--muted)] mb-8">Lo configurás una sola vez. Cada documento que subas se va a abrir con estas preferencias.</p>
            <fieldset>
              <legend className="sr-only">Perfil de accesibilidad</legend>
              <div className="grid sm:grid-cols-2 gap-4">
                {PROFILES.map(p => {
                  const active = sel === p.id;
                  return (
                    <label key={p.id} className={`relative block cursor-pointer rounded-2xl border-2 p-5 ${active ? 'border-[var(--accent)] bg-[var(--soft)]' : 'border-[var(--border)] hover:bg-[var(--soft)]'}`}
                      style={active ? { boxShadow: 'inset 0 0 0 2px var(--accent)' } : null}>
                      <input type="radio" name="perfil" value={p.id} checked={active} onChange={() => choose(p)}
                        className="absolute top-5 right-5 w-6 h-6" style={{ accentColor: 'var(--accent)' }} />
                      <span aria-hidden="true" className="grid place-items-center w-14 h-14 rounded-xl bg-[var(--accent)] text-[var(--onAccent)] text-2xl font-bold mb-4">{p.icon}</span>
                      <span className="block text-2xl font-bold mb-1">Perfil {p.title}</span>
                      <span className="block text-lg text-[var(--muted)] mb-3">{p.desc}</span>
                      <span className="flex flex-wrap gap-2">
                        {p.tags.map(t => <span key={t} className="text-sm font-bold px-3 py-1 rounded-full border-2 border-[var(--border)]">{t}</span>)}
                      </span>
                    </label>
                  );
                })}
              </div>
            </fieldset>
            <div className="mt-8 flex justify-end">
              <Btn variant="primary" className="text-lg px-8 min-h-[56px]" disabled={!sel} onClick={() => setStep(2)}>Siguiente →</Btn>
            </div>
          </section>
        )}

        {step === 2 && (
          <section aria-labelledby="ob2-title">
            <h1 id="ob2-title" ref={headingRef} tabIndex="-1" className="text-4xl font-bold mb-3">Ajustá los detalles</h1>
            <p className="text-xl text-[var(--muted)] mb-8">Mirá la vista previa y cambiá lo que necesites. Podés modificarlo después desde tu perfil.</p>
            <div className="grid lg:grid-cols-2 gap-8">
              <div className="space-y-7">
                <div>
                  <label htmlFor="fs" className="flex justify-between text-lg font-bold mb-2"><span>Tamaño de fuente</span><span>{settings.fontSize} px</span></label>
                  <input id="fs" type="range" min={MIN_FS} max={MAX_FS} value={settings.fontSize} onChange={e => updateSettings({ fontSize: +e.target.value })} className="w-full" />
                </div>
                <div>
                  <label htmlFor="lh" className="flex justify-between text-lg font-bold mb-2"><span>Interlineado</span><span>{settings.lineHeight.toFixed(1)}</span></label>
                  <input id="lh" type="range" min="1.3" max="2.4" step="0.1" value={settings.lineHeight} onChange={e => updateSettings({ lineHeight: +e.target.value })} className="w-full" />
                </div>
                <div>
                  <label htmlFor="ff" className="block text-lg font-bold mb-2">Tipografía</label>
                  <select id="ff" value={settings.font} onChange={e => updateSettings({ font: e.target.value })}
                    className="w-full min-h-[52px] px-3 rounded-xl border-2 border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] text-lg font-bold">
                    {Object.entries(FONTS).map(([k, f]) => <option key={k} value={k}>{f.label}</option>)}
                  </select>
                </div>
                <div>
                  <span className="block text-lg font-bold mb-2" id="tema-lbl">Colores</span>
                  <ThemeButtons compact />
                </div>
                <label className="flex items-center gap-3 text-lg font-bold cursor-pointer min-h-[48px]">
                  <input type="checkbox" className="w-6 h-6" style={{ accentColor: 'var(--accent)' }} checked={!!settings.audioFocus} onChange={e => updateSettings({ audioFocus: e.target.checked })} />
                  Destacar la lectura en voz alta
                </label>
              </div>
              <div>
                <span className="block text-lg font-bold mb-2">Vista previa</span>
                <div className="rounded-2xl border-2 border-[var(--border)] p-6 bg-[var(--bg)]" style={readingStyle(settings)}>
                  <p className="font-bold mb-3" style={{ fontSize: '1.15em' }}>Diseño Universal para el Aprendizaje</p>
                  <p>El DUA propone anticipar la diversidad desde el origen, ofreciendo múltiples formas de representación, de acción y de implicación.</p>
                </div>
              </div>
            </div>
            <div className="mt-10 flex justify-between gap-3">
              <Btn onClick={() => setStep(1)}>← Atrás</Btn>
              <Btn variant="primary" className="text-lg px-8 min-h-[56px]" onClick={finish}>Guardar y continuar</Btn>
            </div>
          </section>
        )}
      </main>
    </div>
  );
}

/* ───────────────────────── Pantalla 2: Dashboard ───────────────────────── */

function Dashboard() {
  const { docs, openDoc, addDoc, setView, announce, profile } = useApp();
  const [query, setQuery] = useState('');
  const [drag, setDrag] = useState(false);
  const [processing, setProcessing] = useState(null); // { name, step }
  const [showKeys, setShowKeys] = useState(false);
  const fileRef = useRef(null);
  const steps = ['Subiendo archivo…', 'Extrayendo texto y estructura…', 'Aplicando tu perfil de accesibilidad…'];

  const handleFile = (file) => {
    if (!file || processing) return;
    setProcessing({ name: file.name, step: 0 });
    announce('Procesando ' + file.name);
    steps.forEach((_, i) => setTimeout(() => setProcessing(p => p && { ...p, step: i }), i * 750));
    setTimeout(() => { const id = addDoc(file); setProcessing(null); announce('Documento listo'); openDoc(id); }, steps.length * 750 + 300);
  };

  const filtered = docs.filter(d => (d.title + ' ' + d.subject).toLowerCase().includes(query.toLowerCase()));
  const profName = (PROFILES.find(p => p.id === profile) || {}).title;

  return (
    <div className="min-h-screen lg:grid lg:grid-cols-[280px_1fr]">
      <aside className="bg-[var(--panel)] border-b-2 lg:border-b-0 lg:border-r-2 border-[var(--border)] p-5 flex lg:flex-col gap-6 items-center lg:items-stretch justify-between">
        <Logo />
        <nav aria-label="Principal" className="flex lg:flex-col gap-2">
          <a href="#contenido" aria-current="page" className="flex items-center gap-3 min-h-[48px] px-4 rounded-xl font-bold bg-[var(--accent)] text-[var(--onAccent)]">
            <span aria-hidden="true">▤</span> Mi biblioteca</a>
          <button type="button" onClick={() => setView('onboarding')} className="flex items-center gap-3 min-h-[48px] px-4 rounded-xl font-bold hover:bg-[var(--soft)] text-left">
            <span aria-hidden="true">⚙</span> Perfil de accesibilidad</button>
          <button type="button" onClick={() => setShowKeys(true)} className="hidden sm:flex items-center gap-3 min-h-[48px] px-4 rounded-xl font-bold hover:bg-[var(--soft)] text-left">
            <span aria-hidden="true">⌨</span> Atajos de teclado</button>
        </nav>
        {profName && <div className="hidden lg:block mt-auto rounded-xl border-2 border-[var(--border)] p-4 text-base">
          <span className="block text-[var(--muted)]">Perfil activo</span><span className="font-bold">{profName}</span></div>}
      </aside>

      <div className="min-w-0">
        <header className="px-6 lg:px-10 py-5 border-b-2 border-[var(--border)] flex flex-wrap items-center gap-4 justify-between">
          <h1 className="text-3xl font-bold">Hola, Lucía <span aria-hidden="true">👋</span></h1>
          <div className="flex items-center gap-3 flex-1 sm:flex-none">
            <label htmlFor="buscar" className="sr-only">Buscar documentos</label>
            <input id="buscar" type="search" value={query} onChange={e => setQuery(e.target.value)} placeholder="Buscar documentos…"
              className="flex-1 sm:w-72 min-h-[48px] px-4 rounded-xl border-2 border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] placeholder:text-[var(--muted)]" />
            <Btn onClick={() => setView('onboarding')} aria-label="Abrir perfil de accesibilidad"><span aria-hidden="true">👤</span><span className="hidden sm:inline">Perfil</span></Btn>
          </div>
        </header>

        <main id="contenido" className="px-6 lg:px-10 py-8 max-w-5xl">
          <h2 className="text-2xl font-bold mb-4">Subir material</h2>
          {!processing ? (
            <div
              onDragOver={e => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
              className={`rounded-3xl border-4 border-dashed p-10 text-center transition-colors ${drag ? 'border-[var(--accent)] bg-[var(--soft)]' : 'border-[var(--border)]'}`}>
              <div aria-hidden="true" className="text-5xl mb-3">⇪</div>
              <p className="text-2xl font-bold mb-2">Arrastrá tu PDF, Word o PowerPoint aquí</p>
              <p className="text-lg text-[var(--muted)] mb-5">o hacé clic para explorar tus archivos</p>
              <input ref={fileRef} id="file" type="file" className="sr-only" accept=".pdf,.doc,.docx,.ppt,.pptx" onChange={e => handleFile(e.target.files[0])} />
              <div className="flex flex-wrap justify-center gap-3">
                <Btn variant="primary" className="text-lg px-8 min-h-[56px]" onClick={() => fileRef.current && fileRef.current.click()}>Elegir archivo</Btn>
                <Btn className="min-h-[56px]" onClick={() => handleFile({ name: 'Apunte_Unidad3_escaneado.pdf' })}>Probar con un archivo de ejemplo</Btn>
              </div>
            </div>
          ) : (
            <div className="rounded-3xl border-4 border-[var(--accent)] p-8" aria-busy="true">
              <p className="text-xl font-bold mb-1">Procesando «{processing.name}»</p>
              <p className="text-lg text-[var(--muted)] mb-5">Esto lo hacía a mano antes. Ahora tarda unos segundos.</p>
              <ol className="space-y-3">
                {steps.map((s, i) => (
                  <li key={s} className="flex items-center gap-3 text-lg">
                    <span aria-hidden="true" className={`grid place-items-center w-8 h-8 rounded-full border-2 border-[var(--accent)] ${i < processing.step ? 'bg-[var(--accent)] text-[var(--onAccent)]' : ''}`}>
                      {i < processing.step ? '✓' : i === processing.step ? <span className="spin block w-4 h-4 rounded-full border-2 border-[var(--accent)] border-t-transparent" /> : ''}
                    </span>
                    <span className={i === processing.step ? 'font-bold' : i < processing.step ? '' : 'text-[var(--muted)]'}>{s}</span>
                  </li>
                ))}
              </ol>
            </div>
          )}

          <div className="flex items-end justify-between mt-12 mb-4">
            <h2 className="text-2xl font-bold">Documentos recientes</h2>
            <span className="text-[var(--muted)]">{filtered.length} {filtered.length === 1 ? 'documento' : 'documentos'}</span>
          </div>
          {filtered.length === 0 ? (
            <p className="text-lg p-6 rounded-2xl border-2 border-[var(--border)]">No hay documentos que coincidan con «{query}».</p>
          ) : (
            <ul className="grid md:grid-cols-2 gap-4">
              {filtered.map(d => (
                <li key={d.id} className="rounded-2xl border-2 border-[var(--border)] p-5 flex flex-col gap-4 bg-[var(--bg)]">
                  <div className="flex items-start gap-4">
                    <span aria-hidden="true" className="grid place-items-center w-12 h-14 rounded-lg bg-[var(--panel)] border-2 border-[var(--border)] text-xs font-bold shrink-0">
                      {d.type === 'PowerPoint' ? 'PPT' : d.type === 'Word' ? 'DOC' : 'PDF'}</span>
                    <div className="min-w-0">
                      <h3 className="text-xl font-bold leading-snug">{d.title}</h3>
                      <p className="text-base text-[var(--muted)]">{d.subject} · {d.type} · {d.date}</p>
                    </div>
                  </div>
                  <ProgressBar value={d.progress} label={'Progreso de lectura de ' + d.title} />
                  <Btn variant="primary" onClick={() => openDoc(d.id)} aria-label={(d.progress > 0 ? 'Continuar leyendo ' : 'Empezar a leer ') + d.title}>
                    {d.progress > 0 ? 'Continuar leyendo' : 'Empezar a leer'} →</Btn>
                </li>
              ))}
            </ul>
          )}
        </main>
      </div>
      {showKeys && <KeysDialog onClose={() => setShowKeys(false)} />}
    </div>
  );
}

/* ───────────────────────── Diálogo accesible ───────────────────────── */

function Dialog({ title, onClose, children, labelId = 'dlg-title' }) {
  const ref = useRef(null);
  const prevFocus = useRef(document.activeElement);
  useEffect(() => {
    const el = ref.current;
    const first = el && el.querySelector('button, [href], input, select, textarea');
    first && first.focus();
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); onClose(); }
      if (e.key === 'Tab' && el) {
        const f = el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const a = f[0], b = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); b.focus(); }
        else if (!e.shiftKey && document.activeElement === b) { e.preventDefault(); a.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('keydown', onKey); prevFocus.current && prevFocus.current.focus && prevFocus.current.focus(); };
  }, []);
  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4" style={{ background: 'rgba(0,0,0,.6)' }} onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div ref={ref} role="dialog" aria-modal="true" aria-labelledby={labelId}
        className="w-full max-w-xl max-h-[90vh] overflow-auto rounded-3xl border-4 border-[var(--accent)] bg-[var(--bg)] text-[var(--fg)] p-7 shadow-2xl">
        <div className="flex items-start justify-between gap-4 mb-4">
          <h2 id={labelId} className="text-2xl font-bold">{title}</h2>
          <Btn variant="secondary" onClick={onClose} aria-label="Cerrar">✕</Btn>
        </div>
        {children}
      </div>
    </div>
  );
}

function KeysDialog({ onClose }) {
  const rows = [['Alt + P', 'Reproducir / pausar lectura'], ['Alt + S', 'Detener lectura'], ['Alt + =', 'Agrandar texto'], ['Alt + −', 'Achicar texto'], ['Alt + T', 'Cambiar tema de color'], ['Alt + A', 'Ir al asistente'], ['Esc', 'Cerrar ventanas'], ['Tab / Shift + Tab', 'Moverse entre controles']];
  return (

      <dl className="divide-y-2 divide-[var(--soft)]">

}

/* ───────────────────────── Lectura en voz alta ───────────────────────── */

function useReadAloud(items, rate, announce) {
  const [status, setStatus] = useState('stopped'); // playing | paused | stopped
  const [idx, setIdx] = useState(-1);
  const token = useRef(0), timer = useRef(null), idxRef = useRef(-1), simRef = useRef(!hasTTS);
  const rateRef = useRef(rate); rateRef.current = rate;

  const speakFrom = useCallback((i) => {
    const my = ++token.current;
    clearTimeout(timer.current);
    if (hasTTS) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    if (i < 0 || i >= items.length) { setStatus('stopped'); setIdx(-1); idxRef.current = -1; if (i >= items.length) announce('Lectura finalizada'); return; }
    setIdx(i); idxRef.current = i; setStatus('playing');
    const next = () => { if (my === token.current) speakFrom(i + 1); };
    const simulate = () => { const w = items[i].text.split(/\s+/).length; timer.current = setTimeout(next, (w * 380) / rateRef.current); };
    if (!simRef.current) {
      try {
        const u = new SpeechSynthesisUtterance(items[i].text);
        u.lang = 'es-AR'; u.rate = rateRef.current;
        const v = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
        if (v) u.voice = v;
        u.onend = next;
        u.onerror = e => { if (my === token.current && e.error !== 'interrupted' && e.error !== 'canceled') { simRef.current = true; simulate(); } };
        window.speechSynthesis.speak(u);
        return;
      } catch (e) { simRef.current = true; }
    }
    simulate();
  }, [items, announce]);

  const play = useCallback(() => {
    if (status === 'paused') {
      if (!simRef.current) { try { window.speechSynthesis.resume(); setStatus('playing'); return; } catch (e) {} }
      speakFrom(idxRef.current); return;
    }
    speakFrom(idxRef.current >= 0 ? idxRef.current : 0);
  }, [status, speakFrom]);
  const pause = useCallback(() => {
    if (!simRef.current) { try { window.speechSynthesis.pause(); } catch (e) {} } else { token.current++; clearTimeout(timer.current); }
    setStatus('paused');
  }, []);
  const stop = useCallback(() => {
    token.current++; clearTimeout(timer.current);
    if (hasTTS) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    setStatus('stopped'); setIdx(-1); idxRef.current = -1;
  }, []);

  useEffect(() => { if (status === 'playing') speakFrom(idxRef.current); }, [rate]); // reinicia el párrafo con la nueva velocidad
  useEffect(() => () => { token.current++; clearTimeout(timer.current); if (hasTTS) { try { window.speechSynthesis.cancel(); } catch (e) {} } }, []);

  return { status, idx, play, pause, stop, speakFrom, simulated: simRef.current };
}

/* ───────────────────────── Asistente (respuestas simuladas) ───────────────────────── */

function mockReply(kind, text) {
  const note = '\n\n(Respuesta simulada para el MVP)';
  if (kind === 'resumir') return 'Resumen de esta página:\n• Un material digital no es accesible solo por ser digital: muchos PDF escaneados no se pueden leer con lector de pantalla.\n• Hay normas (WCAG 2.2 y Ley 26.653), pero casi no se aplican al material de cátedra.\n• Cada año hay más estudiantes con discapacidad y los recursos de adaptación no alcanzan.\n• El Diseño Universal para el Aprendizaje y la IA permiten que el material sea accesible desde el inicio.' + note;
  if (kind === 'conceptos') return 'Conceptos clave:\n• WCAG 2.2: pautas internacionales. El contenido debe ser perceptible, operable, comprensible y robusto.\n• Ley 26.653: obliga a los organismos públicos, como las universidades nacionales, a cumplir esas pautas.\n• Estructura semántica: títulos, listas y tablas marcados para que un lector de pantalla los reconozca.\n• DUA (Diseño Universal para el Aprendizaje): pensar el material para todos desde el principio, en vez de adaptarlo caso por caso.' + note;
  if (kind === 'preguntas') return 'Preguntas de repaso:\n1. ¿Cuáles son los cuatro principios de las WCAG 2.2?\n2. ¿Por qué el cumplimiento de la Ley 26.653 no alcanza al material de cátedra?\n3. ¿Qué diferencia hay entre adaptar un material caso por caso y aplicar el Diseño Universal para el Aprendizaje?' + note;
  if (kind === 'imagen') return 'Sobre el Gráfico 1: ' + IMAGE_ANALYSIS.replace('Análisis de IA: ', '') + note;
  if (kind === 'simplificar') {
    const short = text.split(/\s+/).slice(0, 14).join(' ');
    return 'En palabras más simples:\nEl fragmento «' + short + (text.split(/\s+/).length > 14 ? '…' : '') + '» quiere decir que los materiales de estudio tendrían que poder usarlos todos los estudiantes desde el primer momento, sin esperar a que otra persona los adapte. Lo importante es la autonomía: que cada estudiante pueda leer, escuchar y entender el contenido por su cuenta.' + note;
  }
  const q = text.toLowerCase();
  let body = 'el documento sostiene que la accesibilidad tiene que pensarse desde el diseño del material y no como una adaptación posterior. Si querés, seleccioná un párrafo y te lo explico con palabras más simples.';
  if (q.includes('wcag') || q.includes('principio')) body = 'las WCAG 2.2 piden que el contenido sea perceptible, operable, comprensible y robusto (sección 2, «Marco normativo»).';
  else if (q.includes('dua') || q.includes('universal')) body = 'el DUA propone ofrecer varias formas de representar la información, de participar y de motivarse, para que el material sirva a todos desde el inicio (sección 4).';
  else if (q.includes('gráfico') || q.includes('grafico') || q.includes('matr')) body = 'la matrícula de estudiantes con discapacidad pasó de unos 1.240 en 2019 a unos 3.350 en 2024, con el mayor salto entre 2020 y 2021 (sección 3, Gráfico 1).';
  else if (q.includes('ley')) body = 'la Ley 26.653 obliga a los organismos públicos, incluidas las universidades nacionales, a respetar las pautas de accesibilidad web (sección 2).';
  return 'Basado en el texto actual, la respuesta a tu consulta es: ' + body + note;
}

function Assistant({ messages, typing, onSend, inputRef, selection, rate }) {
  const [draft, setDraft] = useState('');
  const logRef = useRef(null);
  useEffect(() => { const el = logRef.current; if (el) el.scrollTop = el.scrollHeight; }, [messages, typing]);
  const submit = e => { e.preventDefault(); const t = draft.trim(); if (!t) return; onSend(t, 'libre'); setDraft(''); };
  const shortcuts = [['Resumir esta página', 'resumir'], ['Explicar conceptos clave', 'conceptos'], ['Crear 3 preguntas de repaso', 'preguntas']];

  return (
    <section aria-labelledby="asist-title" className="flex flex-col h-full min-h-[560px] lg:min-h-0">
      <div className="px-5 pt-5 pb-3 border-b-2 border-[var(--border)]">
        <h2 id="asist-title" className="text-xl font-bold flex items-center gap-2"><span aria-hidden="true">✦</span> Asistente inteligente</h2>
        <p className="text-base text-[var(--muted)]">Preguntá sobre este documento</p>
      </div>

      <div ref={logRef} role="log" aria-live="polite" aria-label="Conversación con el asistente" tabIndex="0" className="flex-1 overflow-y-auto p-5 space-y-4">
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[92%] rounded-2xl px-4 py-3 text-[17px] leading-relaxed whitespace-pre-line border-2 ${m.role === 'user' ? 'bg-[var(--accent)] text-[var(--onAccent)] border-[var(--accent)] rounded-br-md' : 'bg-[var(--bg)] border-[var(--border)] rounded-bl-md'}`}>
              <span className="sr-only">{m.role === 'user' ? 'Vos dijiste: ' : 'Asistente: '}</span>
              {m.text}
              {m.role === 'ai' && i > 0 && hasTTS && (
                <div className="mt-2"><button type="button" onClick={() => speakOnce(m.text.replace('(Respuesta simulada para el MVP)', ''), rate)}
                  className="text-base font-bold underline underline-offset-4 min-h-[40px]">🔊 Escuchar respuesta</button></div>
              )}
            </div>
          </div>
        ))}
        {typing && (
          <div className="flex justify-start" aria-label="El asistente está escribiendo">
            <div className="rounded-2xl rounded-bl-md px-4 py-3 border-2 border-[var(--border)] flex gap-1 text-2xl leading-none">
              <span className="dot">•</span><span className="dot">•</span><span className="dot">•</span>
            </div>
          </div>
        )}
      </div>

      <div className="p-4 border-t-2 border-[var(--border)] space-y-3">
        {selection && (
          <div className="rounded-xl border-2 border-[var(--accent)] p-3">
            <p className="text-sm font-bold text-[var(--muted)] mb-1">Texto seleccionado</p>
            <p className="text-base italic line-clamp-2 mb-2">«{selection.length > 110 ? selection.slice(0, 110) + '…' : selection}»</p>
            <Btn variant="primary" className="w-full" onClick={() => onSend('Explicame este párrafo con palabras más simples: «' + selection + '»', 'simplificar', selection)}>Explicar con palabras más simples</Btn>
          </div>
        )}
        <div className="flex flex-wrap gap-2" role="group" aria-label="Atajos de consulta">
          {shortcuts.map(([label, kind]) => (
            <button key={kind} type="button" disabled={typing} onClick={() => onSend(label, kind)}
              className="min-h-[44px] px-3 rounded-full border-2 border-[var(--border)] font-bold text-[15px] hover:bg-[var(--soft)] disabled:opacity-50">{label}</button>
          ))}
        </div>
        <form onSubmit={submit} className="flex gap-2">
          <label htmlFor="chat-input" className="sr-only">Escribí tu pregunta</label>
          <input id="chat-input" ref={inputRef} value={draft} onChange={e => setDraft(e.target.value)} autoComplete="off"
            placeholder="Escribí tu pregunta y presioná Enter"
            className="flex-1 min-w-0 min-h-[52px] px-4 rounded-xl border-2 border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] placeholder:text-[var(--muted)]" />
          <Btn type="submit" variant="primary" className="min-h-[52px]" disabled={!draft.trim() || typing} aria-label="Enviar pregunta">Enviar</Btn>
        </form>
      </div>
    </section>
  );
}

/* ───────────────────────── Gráfico (imagen sin descripción) ───────────────────────── */

function BarChart() {
  const W = 640, H = 340, pad = { l: 64, r: 20, t: 30, b: 50 };
  const max = 3500, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, bw = iw / CHART.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Imagen del documento original: gráfico de barras sin descripción alternativa. Usá el botón Interpretar con IA para escuchar o leer su contenido.">
      {[0, 1000, 2000, 3000].map(v => {
        const y = pad.t + ih - (v / max) * ih;
        return <g key={v}><line x1={pad.l} x2={W - pad.r} y1={y} y2={y} style={{ stroke: 'var(--border)' }} strokeDasharray="4 6" />
          <text x={pad.l - 10} y={y + 5} textAnchor="end" style={{ fill: 'var(--fg)', fontSize: 15, fontFamily: 'Arial' }}>{v.toLocaleString('es-AR')}</text></g>;
      })}
      {CHART.map(([yr, v], i) => {
        const h = (v / max) * ih, x = pad.l + i * bw + bw * 0.2, y = pad.t + ih - h;
        return <g key={yr}>
          <rect x={x} y={y} width={bw * 0.6} height={h} rx="4" style={{ fill: 'var(--accent)' }} />
          <text x={x + bw * 0.3} y={H - pad.b + 26} textAnchor="middle" style={{ fill: 'var(--fg)', fontSize: 16, fontFamily: 'Arial', fontWeight: 700 }}>{yr}</text>
        </g>;
      })}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + ih} y2={pad.t + ih} style={{ stroke: 'var(--fg)' }} strokeWidth="2" />
    </svg>
  );
}

function FigureBlock({ onAnalyzed }) {
  const [state, setState] = useState('idle'); // idle | loading
  const [open, setOpen] = useState(false);
  const analyze = () => { setState('loading'); setTimeout(() => { setState('idle'); setOpen(true); }, 2000); };
  return (
    <figure className="my-10 not-prose">
      <div className="relative rounded-2xl border-2 border-[var(--border)] p-4 bg-[var(--bg)]">
        <BarChart />
        <div className="absolute top-3 right-3">
          <button type="button" onClick={analyze} disabled={state === 'loading'} aria-busy={state === 'loading'}
            className="inline-flex items-center gap-2 min-h-[52px] px-5 rounded-xl font-bold text-[17px] bg-[var(--accent)] text-[var(--onAccent)] border-2 border-[var(--onAccent)] shadow-lg disabled:cursor-wait"
            style={{ fontFamily: "'Atkinson Hyperlegible', sans-serif", letterSpacing: 0, wordSpacing: 0 }}>
            {state === 'loading'
              ? <><span className="spin block w-5 h-5 rounded-full border-[3px] border-[var(--onAccent)] border-t-transparent" aria-hidden="true" /> Analizando imagen…</>
              : <><span aria-hidden="true">👁️</span> Interpretar con IA</>}
          </button>
        </div>
      </div>
      <figcaption className="mt-2 text-[0.8em] text-[var(--muted)]">Gráfico 1 <span className="italic">(imagen original sin texto alternativo)</span></figcaption>
      {open && (
        <Dialog title="Interpretación de la imagen" onClose={() => setOpen(false)} labelId="img-title">
          <p className="text-lg leading-relaxed mb-6" style={{ fontSize: 'max(18px, 0.9em)' }}>{IMAGE_ANALYSIS}</p>
          <div className="flex flex-wrap gap-3">
            {hasTTS && <Btn variant="primary" onClick={() => speakOnce(IMAGE_ANALYSIS)}>🔊 Escuchar descripción</Btn>}
            <Btn onClick={() => { setOpen(false); onAnalyzed(); }}>Preguntarle al asistente</Btn>
            <Btn onClick={() => setOpen(false)}>Cerrar</Btn>
          </div>
        </Dialog>
      )}
    </figure>
  );
}

/* ───────────────────────── Pantalla 3: Lector accesible ───────────────────────── */

function ToolsPanel({ audio, readable }) {
  const { settings, updateSettings, announce } = useApp();
  const zoom = d => { const n = clamp(settings.fontSize + d, MIN_FS, MAX_FS); updateSettings({ fontSize: n }); announce('Tamaño ' + n + ' píxeles'); };
  const H = ({ children, id }) => <h3 id={id} className="text-base font-bold uppercase tracking-wide text-[var(--muted)] mb-3">{children}</h3>;
  const audioSection = (
    <section aria-labelledby="t-audio" className={settings.audioFocus ? 'rounded-2xl border-2 border-[var(--accent)] p-4 -mx-1' : ''}>
      <H id="t-audio">Lectura en voz alta</H>
      <div className="grid grid-cols-3 gap-2">
        {audio.status === 'playing'
          ? <Btn variant="primary" onClick={audio.pause} aria-label="Pausar lectura">❚❚</Btn>
          : <Btn variant="primary" onClick={audio.play} aria-label={audio.status === 'paused' ? 'Continuar lectura' : 'Reproducir lectura'}>▶</Btn>}
        <Btn onClick={audio.pause} disabled={audio.status !== 'playing'} aria-label="Pausar">❚❚</Btn>
        <Btn onClick={audio.stop} disabled={audio.status === 'stopped'} aria-label="Detener lectura">■</Btn>
      </div>
      <div className="mt-3" role="group" aria-label="Velocidad de lectura">
        <span className="block text-base font-bold mb-2">Velocidad</span>
        <div className="grid grid-cols-3 gap-2">
          {[0.75, 1, 1.5].map(r => (
            <button key={r} type="button" aria-pressed={settings.rate === r} onClick={() => { updateSettings({ rate: r }); announce('Velocidad ' + r); }}
              className={`min-h-[48px] rounded-xl border-2 font-bold ${settings.rate === r ? 'bg-[var(--accent)] text-[var(--onAccent)] border-[var(--accent)]' : 'border-[var(--border)] hover:bg-[var(--soft)]'}`}>
              x{String(r).replace('.', ',')}</button>
          ))}
        </div>
      </div>
      <p className="mt-3 text-base" aria-live="polite">
        {audio.status === 'stopped' ? 'Listo para leer.' : `${audio.status === 'paused' ? 'En pausa' : 'Leyendo'} · bloque ${audio.idx + 1} de ${readable}`}
      </p>
      {!hasTTS && <p className="mt-1 text-sm text-[var(--muted)]">Tu navegador no tiene voz: se simula el avance.</p>}
    </section>
  );

  return (
    <div className="p-5 space-y-8">
      {settings.audioFocus && audioSection}
      <section aria-labelledby="t-size">
        <H id="t-size">Tamaño del texto</H>
        <div className="flex items-center gap-2">
          <Btn onClick={() => zoom(-2)} disabled={settings.fontSize <= MIN_FS} aria-label="Achicar texto" className="flex-1 text-xl">A−</Btn>
          <span className="w-16 text-center font-bold text-lg" aria-hidden="true">{settings.fontSize}px</span>
          <Btn onClick={() => zoom(2)} disabled={settings.fontSize >= MAX_FS} aria-label="Agrandar texto" className="flex-1 text-2xl">A+</Btn>
        </div>
        <label htmlFor="lh2" className="flex justify-between text-base font-bold mt-4 mb-1"><span>Interlineado</span><span>{settings.lineHeight.toFixed(1)}</span></label>
        <input id="lh2" type="range" min="1.3" max="2.4" step="0.1" value={settings.lineHeight} onChange={e => updateSettings({ lineHeight: +e.target.value })} className="w-full" />
      </section>
      <section aria-labelledby="t-theme">
        <H id="t-theme">Tema</H>
        <ThemeButtons compact />
      </section>
      <section aria-labelledby="t-font">
        <H id="t-font">Tipografía</H>
        <label htmlFor="font-sel" className="sr-only">Tipografía del documento</label>
        <select id="font-sel" value={settings.font} onChange={e => { updateSettings({ font: e.target.value }); announce('Tipografía ' + FONTS[e.target.value].label); }}
          className="w-full min-h-[52px] px-3 rounded-xl border-2 border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] text-lg font-bold">
          {Object.entries(FONTS).map(([k, f]) => <option key={k} value={k}>{f.label}</option>)}
        </select>
      </section>
      {!settings.audioFocus && audioSection}
      <section aria-labelledby="t-keys" className="text-base">
        <H id="t-keys">Atajos</H>
        <ul className="space-y-1 text-[var(--muted)]">
          <li><kbd className="font-bold text-[var(--fg)]">Alt+P</kbd> leer / pausar</li>
          <li><kbd className="font-bold text-[var(--fg)]">Alt+= / Alt+−</kbd> tamaño</li>
          <li><kbd className="font-bold text-[var(--fg)]">Alt+T</kbd> tema · <kbd className="font-bold text-[var(--fg)]">Alt+A</kbd> asistente</li>
        </ul>
      </section>
    </div>
  );
}

function Reader() {
  const { settings, updateSettings, setView, currentDoc, setProgress, announce } = useApp();
  const doc = currentDoc || INITIAL_DOCS[0];
  const readable = useMemo(() => ARTICLE.blocks.map((b, i) => ({ ...b, i })).filter(b => b.type !== 'figure'), []);
  const audio = useReadAloud(readable, settings.rate, announce);
  const activeBlock = audio.idx >= 0 ? readable[audio.idx].i : -1;

  const [messages, setMessages] = useState([{ role: 'ai', text: 'Hola, soy tu asistente de estudio. ¿Qué dudas tenés sobre este documento?' }]);
  const [typing, setTyping] = useState(false);
  const [selection, setSelection] = useState('');
  const [floatPos, setFloatPos] = useState(null);
  const [toolsOpen, setToolsOpen] = useState(false);
  const [progress, setLocalProgress] = useState(doc.progress);
  const chatInput = useRef(null), mainRef = useRef(null), articleRef = useRef(null), titleRef = useRef(null);

  useEffect(() => { titleRef.current && titleRef.current.focus(); }, []);

  const send = useCallback((text, kind, extra) => {
    setMessages(m => [...m, { role: 'user', text }]);
    setTyping(true);
    setFloatPos(null);
    setTimeout(() => { setMessages(m => [...m, { role: 'ai', text: mockReply(kind, extra || text) }]); setTyping(false); }, 1300);
  }, []);

  // Selección de texto dentro del documento
  useEffect(() => {
    const onSel = () => {
      const s = window.getSelection();
      const art = articleRef.current;
      if (!s || s.isCollapsed || !art || !art.contains(s.anchorNode)) { setSelection(''); setFloatPos(null); return; }
      const t = s.toString().trim();
      if (t.length < 12) { setSelection(''); setFloatPos(null); return; }
      setSelection(t);
      try { const r = s.getRangeAt(0).getBoundingClientRect(); setFloatPos({ top: r.bottom + 10, left: clamp(r.left, 12, window.innerWidth - 300) }); } catch (e) {}
    };
    document.addEventListener('selectionchange', onSel);
    return () => document.removeEventListener('selectionchange', onSel);
  }, []);
  useEffect(() => {
    const hide = () => setFloatPos(null);
    const m = mainRef.current; m && m.addEventListener('scroll', hide); window.addEventListener('scroll', hide);
    return () => { m && m.removeEventListener('scroll', hide); window.removeEventListener('scroll', hide); };
  }, []);

  // Progreso de lectura
  useEffect(() => {
    const calc = () => {
      const a = articleRef.current, m = mainRef.current; if (!a || !m) return;
      const r = a.getBoundingClientRect();
      const c = m.scrollHeight > m.clientHeight + 4 ? m.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
      const p = clamp((c.bottom - r.top) / r.height, 0, 1);
      setLocalProgress(prev => Math.max(prev, p));
    };
    const m = mainRef.current; m && m.addEventListener('scroll', calc); window.addEventListener('scroll', calc); calc();
    return () => { m && m.removeEventListener('scroll', calc); window.removeEventListener('scroll', calc); };
  }, []);
  useEffect(() => { setProgress(doc.id, progress); }, [progress]);

  // Seguir el párrafo que se está leyendo
  useEffect(() => {
    if (activeBlock < 0) return;
    const el = document.getElementById('blk-' + activeBlock);
    el && el.scrollIntoView({ block: 'center', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  }, [activeBlock]);

  // Atajos de teclado
  useEffect(() => {
    const onKey = e => {
      if (!e.altKey) return;
      const c = e.code;
      if (c === 'KeyP') { e.preventDefault(); audio.status === 'playing' ? audio.pause() : audio.play(); }
      else if (c === 'KeyS') { e.preventDefault(); audio.stop(); }
      else if (c === 'Equal' || c === 'NumpadAdd') { e.preventDefault(); updateSettings({ fontSize: clamp(settings.fontSize + 2, MIN_FS, MAX_FS) }); }
      else if (c === 'Minus' || c === 'NumpadSubtract') { e.preventDefault(); updateSettings({ fontSize: clamp(settings.fontSize - 2, MIN_FS, MAX_FS) }); }
      else if (c === 'KeyT') { e.preventDefault(); const n = THEME_ORDER[(THEME_ORDER.indexOf(settings.theme) + 1) % THEME_ORDER.length]; updateSettings({ theme: n }); announce('Tema ' + THEMES[n].label); }
      else if (c === 'KeyA') { e.preventDefault(); chatInput.current && chatInput.current.focus(); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [audio, settings, updateSettings, announce]);

  const rs = readingStyle(settings);

  return (
    <div className="flex flex-col lg:h-screen">
      <header className="flex flex-wrap items-center gap-3 px-4 lg:px-5 py-3 border-b-2 border-[var(--border)] bg-[var(--panel)]">
        <Btn onClick={() => { audio.stop(); setView('dashboard'); }}>← Mi biblioteca</Btn>
        <div className="flex-1 min-w-[180px]">
          <p className="font-bold text-lg leading-tight truncate">{doc.title}</p>
          <div className="max-w-xs"><ProgressBar value={progress} label="Progreso de lectura" /></div>
        </div>
        <Btn className="lg:hidden" aria-expanded={toolsOpen} aria-controls="herramientas" onClick={() => setToolsOpen(o => !o)}>⚙ Herramientas</Btn>
        <Btn className="lg:hidden" onClick={() => document.getElementById('asistente').scrollIntoView()}>✦ Asistente</Btn>
        <Btn className="hidden lg:inline-flex" onClick={() => { audio.stop(); setView('onboarding'); }}>👤 Perfil</Btn>
      </header>

      <div className="flex-1 min-h-0 grid lg:grid-cols-[290px_minmax(0,1fr)_390px]">
        <aside id="herramientas" aria-label="Barra de accesibilidad"
          className={`${toolsOpen ? 'block' : 'hidden'} lg:block bg-[var(--panel)] border-b-2 lg:border-b-0 lg:border-r-2 border-[var(--border)] lg:overflow-y-auto`}>
          <ToolsPanel audio={audio} readable={readable.length} />
        </aside>

        <main id="contenido" ref={mainRef} className="lg:overflow-y-auto min-w-0 bg-[var(--bg)]">
          <article ref={articleRef} className="max-w-[72ch] mx-auto px-5 sm:px-8 py-10" style={rs} lang="es">
            <p className="text-[0.75em] font-bold uppercase tracking-wide text-[var(--muted)] mb-2">{ARTICLE.meta}</p>
            <h1 ref={titleRef} tabIndex="-1" className="font-bold mb-6" style={{ fontSize: '1.6em', lineHeight: 1.25 }}>{ARTICLE.title}</h1>
            {settings.audioFocus && audio.status === 'stopped' && (
              <button type="button" onClick={audio.play} className="mb-8 inline-flex items-center gap-3 min-h-[56px] px-6 rounded-2xl bg-[var(--accent)] text-[var(--onAccent)] font-bold"
                style={{ fontSize: 'max(18px, 0.85em)' }}><span aria-hidden="true">▶</span> Escuchar este documento</button>
            )}
            {ARTICLE.blocks.map((b, i) => {
              if (b.type === 'figure') return <FigureBlock key={i} onAnalyzed={() => send('¿Qué muestra el Gráfico 1?', 'imagen')} />;
              const active = i === activeBlock;
              const cls = `reading-block rounded-lg ${active ? 'px-2 -mx-2' : ''}`;
              const style = active ? { background: 'var(--hl)', color: 'var(--hlFg)' } : null;
              return b.type === 'h2'
                ? <h2 key={i} id={'blk-' + i} className={`${cls} font-bold mt-10 mb-3`} style={{ ...style, fontSize: '1.25em', lineHeight: 1.3 }}>{b.text}</h2>
                : <p key={i} id={'blk-' + i} className={`${cls} mb-5`} style={style} aria-current={active ? 'true' : undefined}>{b.text}</p>;
            })}
            <hr className="my-10 border-[var(--border)]" />
            <p className="text-[0.8em] text-[var(--muted)]">Fin del documento · Seleccioná cualquier fragmento para pedir una explicación más simple.</p>
          </article>
        </main>

        <aside id="asistente" aria-label="Panel de asistencia IA" className="bg-[var(--panel)] border-t-2 lg:border-t-0 lg:border-l-2 border-[var(--border)] lg:overflow-hidden flex flex-col">
          <Assistant messages={messages} typing={typing} onSend={send} inputRef={chatInput} selection={selection} rate={settings.rate} />
        </aside>
      </div>

      {floatPos && selection && (
        <div className="fixed z-40" style={{ top: floatPos.top, left: floatPos.left }}>
          <button type="button" onMouseDown={e => e.preventDefault()}
            onClick={() => send('Explicame este párrafo con palabras más simples: «' + selection + '»', 'simplificar', selection)}
            className="inline-flex items-center gap-2 min-h-[48px] px-4 rounded-xl font-bold bg-[var(--accent)] text-[var(--onAccent)] border-2 border-[var(--onAccent)] shadow-xl">
            <span aria-hidden="true">✦</span> Explicar más simple</button>
        </div>
      )}
    </div>
  );
}

/* ───────────────────────── App ───────────────────────── */

function Router() {
  const { view } = useApp();
  return (
    <>
      <a href="#contenido" className="skip-link px-4 py-3 rounded-xl font-bold bg-[var(--accent)] text-[var(--onAccent)]">Saltar al contenido</a>
      {view === 'onboarding' && <Onboarding />}
      {view === 'dashboard' && <Dashboard />}
      {view === 'reader' && <Reader />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><Router /></AppProvider>);
</script>
</body>
</html>
